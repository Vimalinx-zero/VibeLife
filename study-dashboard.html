<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowStudy - 沉浸式居家学习站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* 动态多彩背景 */
            background: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                        radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                        radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-color: #1a1a1a; /* 深色底更加凸显毛玻璃 */
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* 毛玻璃卡片通用样式 (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* 鼠标悬停效果：放大 + 阴影加重 + 边框变亮 */
        .glass-card:hover {
            transform: translateY(-5px) scale(1.02);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            cursor: pointer;
        }

        /* 隐藏的顶部栏动画 */
        .top-bar {
            transform: translateY(-90%); /* 默认只露出一丢丢或者完全隐藏 */
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* 触发区域：鼠标移到顶部时显示 */
        .top-trigger:hover .top-bar,
        .top-bar:hover {
            transform: translateY(0);
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4 md:p-8 relative selection:bg-pink-500 selection:text-white">

    <div class="top-trigger fixed top-0 left-0 w-full h-16 z-50 flex justify-center">
        <div class="top-bar absolute top-0 w-[90%] md:w-[60%] h-16 glass-card rounded-b-3xl flex items-center justify-between px-8 mt-0">
            <div class="flex items-center space-x-4">
                <div class="text-pink-400 text-xl"><i class="fa-solid fa-stopwatch"></i></div>
                <div class="text-lg font-semibold font-mono" id="pomodoro">25:00</div>
                <button class="text-xs bg-white/10 px-3 py-1 rounded-full hover:bg-pink-500 transition">开始专注</button>
            </div>
            
            <div class="flex items-center space-x-6 text-gray-300">
                <i class="fa-solid fa-backward hover:text-white cursor-pointer"></i>
                <i class="fa-solid fa-play hover:text-white cursor-pointer text-xl"></i>
                <i class="fa-solid fa-forward hover:text-white cursor-pointer"></i>
                <span class="text-xs opacity-60">Lo-Fi Beats - Study Girl</span>
            </div>

            <div class="flex items-center space-x-4">
                <i class="fa-solid fa-gear hover:rotate-90 transition duration-500 cursor-pointer"></i>
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-400 to-pink-500"></div>
            </div>
        </div>
        <div class="w-32 h-1 bg-white/20 rounded-full absolute bottom-2"></div>
    </div>

    <main class="w-full max-w-7xl grid grid-cols-1 md:grid-cols-4 grid-rows-4 gap-6 h-auto md:h-[85vh] mt-10">
        
        <div class="glass-card rounded-3xl col-span-1 md:col-span-2 md:row-span-2 p-8 flex flex-col justify-between relative overflow-hidden group">
            <div class="absolute -right-10 -top-10 w-64 h-64 bg-purple-500/20 rounded-full blur-3xl group-hover:bg-purple-500/30 transition-all duration-500"></div>
            
            <div>
                <h1 class="text-4xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">早安, Alex.</h1>
                <p class="text-gray-400">今天也是充满智慧的一天。</p>
            </div>
            
            <div class="flex justify-between items-end">
                <div>
                    <div class="text-6xl font-thin font-mono tracking-tighter" id="main-clock">10:27</div>
                    <div class="text-lg text-gray-400 mt-1" id="main-date">11月21日 星期五</div>
                </div>
                <button class="bg-white text-black px-6 py-3 rounded-xl font-semibold hover:bg-gray-200 transition shadow-lg shadow-white/10 flex items-center gap-2">
                    继续上次学习 <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <div class="glass-card rounded-3xl col-span-1 md:row-span-2 p-6 flex flex-col items-center justify-center text-center hover:bg-gradient-to-b hover:from-white/10 hover:to-transparent group">
            <div class="w-20 h-20 bg-blue-500/20 rounded-full flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                <i class="fa-solid fa-pen-to-square text-3xl text-blue-300"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">在线题库</h2>
            <p class="text-sm text-gray-400 mb-6">覆盖数学、物理、英语<br>智能推荐薄弱项</p>
            <div class="w-full bg-gray-700 h-2 rounded-full overflow-hidden">
                <div class="bg-blue-500 w-[75%] h-full"></div>
            </div>
            <p class="text-xs text-gray-400 mt-2">今日目标完成度 75%</p>
        </div>

        <div class="glass-card rounded-3xl col-span-1 md:row-span-4 p-6 flex flex-col">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-trophy text-yellow-400 mr-2"></i>学霸榜</h3>
                <span class="text-xs bg-green-500/20 text-green-300 px-2 py-1 rounded">在线 128人</span>
            </div>
            <div class="space-y-4 overflow-y-auto flex-1 pr-2">
                <div class="flex items-center space-x-3 p-2 rounded-lg hover:bg-white/5 transition">
                    <span class="text-yellow-400 font-bold font-mono">01</span>
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="w-8 h-8 rounded-full bg-gray-600">
                    <div class="flex-1">
                        <div class="text-sm font-medium">Sarah L.</div>
                        <div class="text-xs text-gray-500">专注 4h 20m</div>
                    </div>
                </div>
                <div class="flex items-center space-x-3 p-2 rounded-lg hover:bg-white/5 transition">
                    <span class="text-gray-300 font-bold font-mono">02</span>
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka" class="w-8 h-8 rounded-full bg-gray-600">
                    <div class="flex-1">
                        <div class="text-sm font-medium">Mike Z.</div>
                        <div class="text-xs text-gray-500">专注 3h 50m</div>
                    </div>
                </div>
                <div class="flex items-center space-x-3 p-2 rounded-lg hover:bg-white/5 transition">
                    <span class="text-orange-700 font-bold font-mono">03</span>
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=John" class="w-8 h-8 rounded-full bg-gray-600">
                    <div class="flex-1">
                        <div class="text-sm font-medium">Yu Chen</div>
                        <div class="text-xs text-gray-500">专注 3h 10m</div>
                    </div>
                </div>
                </div>
        </div>

        <div class="glass-card rounded-3xl p-6 flex flex-col justify-between group">
            <div class="flex justify-between items-start">
                <div class="p-3 bg-red-500/20 rounded-xl text-red-300">
                    <i class="fa-solid fa-bug"></i>
                </div>
                <span class="text-2xl font-bold">12</span>
            </div>
            <div>
                <h3 class="font-semibold">错题积累</h3>
                <p class="text-xs text-gray-400">待复习题目</p>
            </div>
        </div>

        <div class="glass-card rounded-3xl p-6 flex flex-col justify-between group">
            <div class="flex justify-between items-start">
                <div class="p-3 bg-yellow-500/20 rounded-xl text-yellow-300">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <span class="text-2xl font-bold">5</span>
            </div>
            <div>
                <h3 class="font-semibold">随手笔记</h3>
                <p class="text-xs text-gray-400">今日新增 2 条</p>
            </div>
        </div>

        <div class="glass-card rounded-3xl col-span-1 md:col-span-2 p-4 flex items-center gap-4 relative overflow-hidden">
            <div class="absolute inset-0 flex items-end justify-center space-x-1 opacity-20 pointer-events-none">
                <div class="w-2 h-8 bg-white animate-pulse"></div>
                <div class="w-2 h-12 bg-white animate-pulse delay-75"></div>
                <div class="w-2 h-6 bg-white animate-pulse delay-150"></div>
                <div class="w-2 h-10 bg-white animate-pulse delay-100"></div>
                <div class="w-2 h-5 bg-white animate-pulse"></div>
            </div>

            <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 shadow-lg flex-shrink-0"></div>
            <div class="flex-1 z-10">
                <h3 class="font-bold">Deep Focus Playlist</h3>
                <p class="text-xs text-gray-400">Spotify & Apple Music Sync</p>
                <div class="mt-2 flex gap-2 text-xl">
                    <i class="fa-solid fa-circle-play hover:text-pink-400 cursor-pointer transition"></i>
                    <i class="fa-solid fa-forward-step hover:text-pink-400 cursor-pointer transition text-base mt-1"></i>
                </div>
            </div>
            <div class="z-10">
                 <input type="range" class="w-24 h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer">
            </div>
        </div>

    </main>

    <script>
        // 1. 时钟逻辑
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('main-clock').innerText = `${hours}:${minutes}`;

            const options = { month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('main-date').innerText = now.toLocaleDateString('zh-CN', options);
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 2. 简单的鼠标光效跟随逻辑 (可选优化)
        // 这里可以添加 JS 来让光影跟随鼠标移动，但在 CSS 中使用 hover 已经能达到基础效果。
    </script>
</body>
</html>
